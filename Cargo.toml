[workspace]
resolver = "2"
members = [
    "crates/vox-types",
    "crates/vox-core",
    "crates/vox-api",
    "crates/vox-stt",
    "crates/vox-retrieval",
    "crates/vox-ingest",
    "crates/vox-grounding",
    "crates/vox-llm",
    "crates/vox-guard",
    "crates/vox-bench",
    "crates/vox-oreo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.dependencies]
vox-types = { path = "crates/vox-types" }
vox-core = { path = "crates/vox-core" }
vox-api = { path = "crates/vox-api" }
vox-stt = { path = "crates/vox-stt" }
vox-retrieval = { path = "crates/vox-retrieval" }
vox-ingest = { path = "crates/vox-ingest" }
vox-grounding = { path = "crates/vox-grounding" }
vox-llm = { path = "crates/vox-llm" }
vox-guard = { path = "crates/vox-guard" }
vox-bench = { path = "crates/vox-bench" }
vox-oreo = { path = "crates/vox-oreo" }

async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tantivy = "0.22"
unicode-normalization = "0.1"
base64 = "0.22"
http-body-util = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
