vox-guard = { workspace = true }
vox-llm = { workspace = true }
vox-oreo = { workspace = true }
vox-retrieval = { workspace = true }
vox-stt = { workspace = true }
vox-types = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[[bin]]
name = "vox-bench"
path = "src/main.rs"
